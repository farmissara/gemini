    <line x1="150" y1="352" x2="228" y2="352" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="370" x2="216" y2="370" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" />
