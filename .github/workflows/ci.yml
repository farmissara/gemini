name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run migrations:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Run API integration tests when a test server is configured
        if: ${{ vars.TEST_BASE_URL != '' }}
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: npm run test:api

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/eduverse-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eduverse-preview.log
          exit 1
      - name: Run browser smoke tests
        env:
          TEST_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e
