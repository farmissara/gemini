services:
  - type: web
    name: khaonangtuam-eduverse
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_SUPABASE_URL
        value: https://fjjxsljqzwxboqupoloe.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
