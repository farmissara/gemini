services:
  - type: web
    name: khaonangtuam-eduverse
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SUPABASE_URL
        value: https://fjjxsljqzwxboqupoloe.supabase.co
      - key: VITE_SUPABASE_URL
        value: https://fjjxsljqzwxboqupoloe.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_CRON_SECRET
        sync: false
      - key: SCHOOL_AI_ENCRYPTION_KEY
        sync: false
      - key: APP_SITE_URL
        value: https://baanpakkru.onrender.com
